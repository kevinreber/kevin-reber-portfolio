<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#54b78a" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

  <meta property="og:title" content="Kevin Reber | Software Engineer" />
  <meta property="og:description" content="Kevin Reber's Software Engineering Portfolio" />
  <meta property="og:image"

  <!-- Bootstrap CSS -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css?family=Fira+Code&display=swap" rel="stylesheet">
  <!-- Favicon -->
  <link rel="icon" href="public/images/favicon/favicon.ico" type="image/x-icon">

  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" crossorigin="anonymous">
  </script>
  <script>
    //Change nav-bar shadow on scroll
    $(window).scroll(() => {
      $('.navbar').toggleClass('scroll', $(this).scrollTop() > 10);
    });
  </script>
  <script src='navbar.js'>
  </script>
  <script src="layout.js">
  </script>
  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js');
      });
    }
  </script>
